[package]
name = "shakespeare-speak"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Find a verified Shakespeare quotation for a modern phrase"
license = "MIT"

[[bin]]
name = "shakespeare-speak"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = { version = "2.12", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
