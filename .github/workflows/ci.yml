name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

# Only GitHub-maintained actions are used, so there is no third-party action to
# pin. For a stricter supply chain, pin the `uses:` lines below to commit SHAs.

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The corpus is compiled into the binary, so a checkout without it cannot
      # build. Fail early with a clear message instead of a confusing build.rs
      # panic.
      - name: Check the corpus is committed
        run: |
          count=$(find data/works -name '*.txt' 2>/dev/null | wc -l)
          echo "found $count work files"
          if [ "$count" -lt 44 ]; then
            echo "::error::data/works must hold 44 .txt files (compiled in)"
            exit 1
          fi

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal -c rustfmt -c clippy
          rustup default stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets

  build:
    name: ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: zip
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - name: Check the corpus is committed
        run: |
          count=$(find data/works -name '*.txt' 2>/dev/null | wc -l)
          if [ "$count" -lt 44 ]; then
            echo "::error::data/works must hold 44 .txt files (compiled in)"
            exit 1
          fi

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-

      - name: Install musl tools (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # musl.cc ships a ready-made cross toolchain; Ubuntu has no
      # aarch64-musl-gcc package.
      - name: Install musl cross toolchain (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          URL=https://musl.cc/aarch64-linux-musl-cross.tgz
          curl -fsSL "$URL" -o /tmp/musl-cross.tgz
          sudo tar xzf /tmp/musl-cross.tgz -C /opt
          echo "/opt/aarch64-linux-musl-cross/bin" >> "$GITHUB_PATH"

      - name: Build
        env:
          # rustls pulls in ring, which compiles C, so the C compiler has to
          # match the target libc.
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: aarch64-linux-musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify the Linux binary is static
        if: contains(matrix.target, 'linux')
        run: |
          BIN="target/${{ matrix.target }}/release/shakespeare-speak"
          file "$BIN"
          if ! file "$BIN" | grep -q "static"; then
            echo "::error::${{ matrix.target }} binary is not statically linked"
            exit 1
          fi

      - name: Install qemu
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      # Run from /tmp so the process cannot fall back on a data/ directory.
      # The Intel macOS binary is built on an arm64 runner and is not executed
      # here; it would need Rosetta, which is not guaranteed to be installed.
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          DIR="$GITHUB_WORKSPACE/target/${{ matrix.target }}/release"
          BIN="$DIR/shakespeare-speak"
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-musl) RUN="qemu-aarch64-static $BIN" ;;
            *) RUN="$BIN" ;;
          esac

          cd /tmp
          OUT=$($RUN --search "at one fell swoop")
          echo "$OUT"
          echo "$OUT" | grep -q "At one fell swoop?"

      - name: Package
        run: |
          NAME="shakespeare-speak-${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/shakespeare-speak" dist/
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip -q "$NAME.zip" shakespeare-speak
          else
            tar czf "$NAME.tar.gz" shakespeare-speak
          fi
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: shakespeare-speak-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
